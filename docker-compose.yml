# Postgres + pgvector only. No RDS, no cloud DB (CLAUDE.md §3).
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rbi-db
    environment:
      POSTGRES_USER: rbi
      POSTGRES_PASSWORD: rbi
      POSTGRES_DB: rbi
    ports:
      # host 5433 -> container 5432, to avoid clashing with a local Postgres
      - "5433:5432"
    volumes:
      - rbi_pgdata:/var/lib/postgresql/data
      - ./src/rbi/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./src/rbi/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rbi -d rbi"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rbi_pgdata:
